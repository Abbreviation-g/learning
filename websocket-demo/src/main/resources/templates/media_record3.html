
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCM录音应用</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-gradient-to-r from-indigo-500 to-purple-600 p-6 text-white">
            <h1 class="text-3xl font-bold flex items-center gap-3">
                <i class="fas fa-microphone-alt"></i>
                PCM录音应用
            </h1>
            <p class="mt-2 opacity-90">录制高质量PCM音频并下载</p>
        </div>

        <div class="p-6">
            <div class="flex flex-col items-center gap-6">
                <div class="w-full">
                    <div class="audio-visualizer flex items-end justify-center p-4" id="visualizer">
                        <div class="text-white text-center">
                            <i class="fas fa-waveform-lines text-3xl mb-2"></i>
                            <p>音频可视化</p>
                        </div>
                    </div>
                </div>

                <div class="w-full flex flex-col items-center gap-4">
                    <button id="recordButton" class="record-btn bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white font-bold py-4 px-8 rounded-full text-lg shadow-lg transform hover:scale-105 transition-all duration-300 flex items-center gap-3">
                        <i class="fas fa-microphone"></i>
                        <span id="buttonText">开始录音</span>
                    </button>

                    <div id="recordingIndicator" class="hidden flex items-center gap-2 text-red-500 font-medium">
                        <i class="fas fa-circle animate-pulse"></i>
                        <span>录音中...</span>
                    </div>
                </div>

                <div id="statusMessage" class="w-full hidden p-4 rounded-lg text-center">
                </div>

                <div id="downloadSection" class="w-full hidden">
                    <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                        <h3 class="font-bold text-green-800 flex items-center gap-2 mb-2">
                            <i class="fas fa-check-circle">
                                录音完成
                        </h3>
                        <p class="text-green-700 mb-4">录音文件已准备就绪，可以下载</p>
                        <a id="downloadLink" class="inline-flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                            <i class="fas fa-download">
                                下载PCM文件
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-gray-50 p-6 border-t">
            <h3 class="font-bold text-gray-800 mb-3 flex items-center gap-2">
                <i class="fas fa-info-circle"></i>
                技术说明
            </h3>
            <ul class="text-sm text-gray-600 space-y-2">
                <li class="flex items-start gap-2">
                    <i class="fas fa-check-circle text-green-500 mt-1"></i>
                    <span>音频格式: PCM float32 (单通道, 16000Hz采样率)</span>
                </li>
                <li class="flex items-start gap-2">
                    <i class="fas fa-check-circle text-green-500 mt-1"></i>
                    <span>字节序: Little Endian</span>
                </li>
                <li class="flex items-start gap-2">
                    <i class="fas fa-check-circle text-green-500 mt-1"></i>
                    <span>浏览器支持: Chrome, Firefox, Edge等现代浏览器</span>
                </li>
            </ul>
        </div>
    </div>
</div>

<script>
    class PCMRecorder {
        constructor() {
            this.mediaRecorder = null;
            this.audioContext = null;
            this.audioStream = null;
            this.isRecording = false;
            this.audioChunks = [];
            this.sampleRate = 16000;
        }

        async init() {
            try {
                this.audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        sampleRate: this.sampleRate,
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });

                this.audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: this.sampleRate
                });

                return true;
            } catch (error) {
                console.error('初始化录音设备失败:', error);
                throw new Error('无法访问麦克风，请检查权限设置');
            }
        }

        async startRecording() {
            if (this.isRecording) return;

            try {
                await this.init();

                const source = this.audioContext.createMediaStreamSource(this.audioStream);
                const processor = this.audioContext.createScriptProcessor(4096, 1, 1);

                processor.onaudioprocess = (e) => {
                    if (!this.isRecording) return;

                    const inputData = e.inputBuffer.getChannelData(0);
                    this.audioChunks.push(new Float32Array(inputData));
                };

                source.connect(processor);
                processor.connect(this.audioContext.destination);

                this.audioProcessor = processor;
                this.isRecording = true;

                return true;
            } catch (error) {
                throw error;
            }
        }

        stopRecording() {
            if (!this.isRecording) return null;

            this.isRecording = false;

            if (this.audioProcessor) {
                this.audioProcessor.disconnect();
            }

            if (this.audioStream) {
                this.audioStream.getTracks().forEach(track => track.stop());
            }

            if (this.audioContext) {
                this.audioContext.close();
            }

            return this.convertToPCM();
        }

        convertToPCM() {
            if (this.audioChunks.length === 0) return null;

            // 计算总长度
            let totalLength = 0;
            this.audioChunks.forEach(chunk => {
                totalLength += chunk.length;
            });

            // 合并所有音频数据
            const pcmData = new Float32Array(totalLength);
            let offset = 0;
            this.audioChunks.forEach(chunk => {
                pcmData.set(chunk, offset);
                offset += chunk.length;
            });

            // 转换为Little Endian字节序的PCM数据
            const buffer = new ArrayBuffer(pcmData.length * 4);
            const view = new DataView(buffer);

            for (let i = 0; i < pcmData.length; i++) {
                const sample = Math.max(-1, Math.min(1, pcmData[i]));
                view.setFloat32(i * 4, sample, true); // true表示Little Endian
            }

            // 清空缓存
            this.audioChunks = [];

            return buffer;
        }
    }

    // UI控制器
    class UIController {
        constructor() {
            this.recordButton = document.getElementById('recordButton');
            this.buttonText = document.getElementById('buttonText');
            this.recordingIndicator = document.getElementById('recordingIndicator');
            this.statusMessage = document.getElementById('statusMessage');
            this.downloadSection = document.getElementById('downloadSection');
            this.downloadLink = document.getElementById('downloadLink');
            this.visualizer = document.getElementById('visualizer');

            this.recorder = new PCMRecorder();
            this.setupEventListeners();
        }

        setupEventListeners() {
            this.recordButton.addEventListener('click', () => {
                if (this.recorder.isRecording) {
                    this.stopRecording();
                } else {
                    this.startRecording();
                }
            });
        }

        async startRecording() {
            try {
                this.showStatus('正在启动录音设备...', 'info');
                await this.recorder.startRecording();

                this.recordButton.classList.add('recording', 'bg-gradient-to-r', 'from-red-600', 'to-red-700');
                this.buttonText.textContent = '停止录音';
                this.recordingIndicator.classList.remove('hidden');
                this.hideStatus();
                this.hideDownload();

                console.log('开始录音');
            } catch (error) {
                this.showStatus(error.message, 'error');
                console.error('录音启动失败:', error);
            }
        }

        stopRecording() {
            try {
                const pcmBuffer = this.recorder.stopRecording();

                if (pcmBuffer) {
                    this.createDownloadLink(pcmBuffer);
                    this.showStatus('录音完成，准备下载', 'success');
                    this.showDownload();
                } else {
                    this.showStatus('未录制到音频数据', 'warning');
                }

                this.recordButton.classList.remove('recording', 'bg-gradient-to-r', 'from-red-600', 'to-red-700');
                this.buttonText.textContent = '开始录音';
                this.recordingIndicator.classList.add('hidden');

                console.log('录音结束');
            } catch (error) {
                this.showStatus('录音处理失败: ' + error.message, 'error');
                console.error('录音处理失败:', error);
            }
        }

        createDownloadLink(buffer) {
            const blob = new Blob([buffer], { type: 'audio/pcm' });
            const url = URL.createObjectURL(blob);

            this.downloadLink.href = url;
            this.downloadLink.download = `recording_${new Date().getTime()}.pcm`;

            // 清理旧的URL对象
            if (this.downloadUrl) {
                URL.revokeObjectURL(this.downloadUrl);
            }
            this.downloadUrl = url;
        }

        showStatus(message, type) {
            this.statusMessage.textContent = message;
            this.statusMessage.className = 'w-full p-4 rounded-lg text-center ';

            switch(type) {
                case 'success':
                    this.statusMessage.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-200');
                    break;
                case 'error':
                    this.statusMessage.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-200');
                    break;
                case 'warning':
                    this.statusMessage.classList.add('bg-yellow-100', 'text-yellow-800', 'border', 'border-yellow-200');
                    break;
                case 'info':
                    this.statusMessage.classList.add('bg-blue-100', 'text-blue-800', 'border', 'border-blue-200');
                    break;
            }

            this.statusMessage.classList.remove('hidden');
        }

        hideStatus() {
            this.statusMessage.classList.add('hidden');
        }

        showDownload() {
            this.downloadSection.classList.remove('hidden');
        }

        hideDownload() {
            this.downloadSection.classList.add('hidden');
        }
    }

    // 初始化应用
    document.addEventListener('DOMContentLoaded', () => {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            document.getElementById('statusMessage').innerHTML = `
                    <div class="bg-red-100 border border-red-200 text-red-800 p-4 rounded-lg">
                        <h3 class="font-bold flex items-center gap-2">
                            <i class="fas fa-exclamation-triangle"></i>
                            浏览器不支持
                        </h3>
                        <p class="mt-2">您的浏览器不支持录音功能，请使用Chrome、Firefox或Edge等现代浏览器</p>
                    </div>
                `;
            document.getElementById('recordButton').disabled = true;
            return;
        }

        new UIController();
    });
</script>
</body>
</html>
